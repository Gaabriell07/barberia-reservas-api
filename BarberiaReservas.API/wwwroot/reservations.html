<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reservas - Demo</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <h2>Reservas</h2>
  <p>Crear reserva (demo, no requiere autenticación para la presentación)</p>
  <label>UserId: <input type="number" id="userId" value="1" /></label>
  <label>Start: <input type="datetime-local" id="start" /></label>
  <label>Duration (min): <input type="number" id="duration" value="30" /></label>
  <button id="create">Crear</button>
  <pre id="result"></pre>

  <script>
    document.getElementById('create').addEventListener('click', async () => {
      const payload = {
        userId: parseInt(document.getElementById('userId').value, 10),
        start: document.getElementById('start').value,
        durationMinutes: parseInt(document.getElementById('duration').value, 10)
      };

      const res = await fetch('/api/reservations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    });
  </script>
</body>
</html>

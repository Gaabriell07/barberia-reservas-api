<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber Shop Premium</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: linear-gradient(to right, #0f0f0f, #1c1c1c);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        .navbar-brand {
            color: #ff9800 !important;
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .hero-section {
            text-align: center;
            margin-top: 60px;
            margin-bottom: 40px;
        }

        .hero-section h1 {
            font-size: 3rem;
            font-weight: bold;
            color: #ff9800;
        }

        .hero-section p {
            color: #bdbdbd;
            font-size: 1.1rem;
        }

        .card {
            background: rgba(30, 30, 30, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
        }

        h3 {
            color: #ff9800;
            font-weight: bold;
        }

        .form-control {
            background-color: #2a2a2a;
            border: 1px solid #555;
            color: white;
            border-radius: 12px;
            padding: 12px;
        }

        .form-control::placeholder {
            color: #aaa;
        }

        .form-control:focus {
            background-color: #2a2a2a;
            color: white;
            border-color: #ff9800;
            box-shadow: 0 0 12px rgba(255, 152, 0, 0.4);
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff9800, #ffb74d);
            border: none;
            border-radius: 12px;
            font-weight: bold;
            padding: 10px;
            transition: 0.3s;
        }

        .btn-primary:hover {
            transform: scale(1.03);
            opacity: 0.95;
        }

        .btn-danger {
            border-radius: 10px;
            font-weight: bold;
        }

        .btn-warning {
            border-radius: 10px;
            font-weight: bold;
            color: black;
        }

        .table {
            color: white;
            vertical-align: middle;
        }

        .table thead {
            background-color: #ff9800;
            color: black;
        }

        .table-hover tbody tr:hover {
            background-color: rgba(255, 152, 0, 0.15);
            transition: 0.3s;
        }

        .price-badge {
            background-color: rgba(255, 152, 0, 0.15);
            color: #ffb74d;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .duration-badge {
            background-color: rgba(33, 150, 243, 0.15);
            color: #64b5f6;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            color: #888;
            padding-bottom: 20px;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark px-4 py-3">
        <span class="navbar-brand">
            <i class="bi bi-scissors"></i>
            BARBER SHOP "LOS PIBES"
        </span>
    </nav>

    <!-- HERO -->
    <div class="hero-section">
        <h1>Sistema de Gestión de Servicios</h1>

        <p>
            Administra los servicios de la barbería de manera moderna y profesional
        </p>
    </div>

    <!-- CONTENIDO -->
    <div class="container">

        <!-- FORMULARIO -->
        <div class="card p-4 mb-5">

            <h3 class="mb-4">
                <i class="bi bi-plus-circle-fill"></i>
                Agregar / Editar Servicio
            </h3>

            <div class="row g-3">

                <div class="col-md-3">
                    <input type="text" id="name" class="form-control" placeholder="Nombre del servicio">
                </div>

                <div class="col-md-3">
                    <input type="text" id="description" class="form-control"
                        placeholder="Descripción del servicio">
                </div>

                <div class="col-md-2">
                    <input type="number" id="price" class="form-control" placeholder="Precio">
                </div>

                <div class="col-md-2">
                    <input type="number" id="duration" class="form-control" placeholder="Duración">
                </div>

                <div class="col-md-2">
                    <button class="btn btn-primary w-100" onclick="saveService()">
                        <i class="bi bi-floppy-fill"></i>
                        Guardar
                    </button>
                </div>

            </div>
        </div>

        <!-- TABLA -->
        <div class="card p-4">

            <h3 class="mb-4">
                <i class="bi bi-card-list"></i>
                Lista de Servicios
            </h3>

            <div class="table-responsive">

                <table class="table table-dark table-hover align-middle">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Precio</th>
                            <th>Duración</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="servicesTable">

                    </tbody>

                </table>

            </div>

        </div>

        <!-- FOOTER -->
        <div class="footer">
            © 2026 Barber Shop Premium - Sistema de Reservas
        </div>

    </div>

    <!-- SCRIPT -->
    <script>

        const apiUrl = "http://localhost:5264/api/services";

        let editingServiceId = null;

        // ==========================
        // CARGAR SERVICIOS
        // ==========================
        async function loadServices() {

            const response = await fetch(apiUrl);
            const services = await response.json();

            const table = document.getElementById("servicesTable");

            table.innerHTML = "";

            services.forEach(service => {

                table.innerHTML += `
                    <tr>

                        <td>${service.id}</td>

                        <td>
                            <strong>${service.name}</strong>
                        </td>

                        <td>
                            ${service.description}
                        </td>

                        <td>
                            <span class="price-badge">
                                S/. ${service.price}
                            </span>
                        </td>

                        <td>
                            <span class="duration-badge">
                                ${service.durationMinutes} min
                            </span>
                        </td>

                        <td>

                            <button class="btn btn-warning btn-sm me-2"
                                onclick="editService(
                                    ${service.id},
                                    '${service.name}',
                                    '${service.description}',
                                    ${service.price},
                                    ${service.durationMinutes}
                                )">

                                <i class="bi bi-pencil-fill"></i>
                                Editar

                            </button>

                            <button class="btn btn-danger btn-sm"
                                onclick="deleteService(${service.id})">

                                <i class="bi bi-trash-fill"></i>
                                Eliminar

                            </button>

                        </td>

                    </tr>
                `;
            });
        }

        // ==========================
        // GUARDAR / EDITAR
        // ==========================
        async function saveService() {

            const service = {
                name: document.getElementById("name").value,
                description: document.getElementById("description").value,
                price: parseFloat(document.getElementById("price").value),
                durationMinutes: parseInt(document.getElementById("duration").value),
                isActive: true
            };

            // VALIDACIÓN SIMPLE
            if (
                !service.name ||
                !service.description ||
                isNaN(service.price) ||
                isNaN(service.durationMinutes)
            ) {
                alert("Completa todos los campos");
                return;
            }

            // EDITAR
            if (editingServiceId !== null) {

                await fetch(`${apiUrl}/${editingServiceId}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(service)
                });

                alert("Servicio actualizado correctamente");

                editingServiceId = null;

            } else {

                // CREAR
                await fetch(apiUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(service)
                });

                alert("Servicio agregado correctamente");
            }

            clearForm();

            loadServices();
        }

        // ==========================
        // EDITAR
        // ==========================
        function editService(id, name, description, price, durationMinutes) {

            editingServiceId = id;

            document.getElementById("name").value = name;
            document.getElementById("description").value = description;
            document.getElementById("price").value = price;
            document.getElementById("duration").value = durationMinutes;

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        // ==========================
        // ELIMINAR
        // ==========================
        async function deleteService(id) {

            if (!confirm("¿Deseas eliminar este servicio?"))
                return;

            await fetch(`${apiUrl}/${id}`, {
                method: "DELETE"
            });

            alert("Servicio eliminado");

            loadServices();
        }

        // ==========================
        // LIMPIAR FORMULARIO
        // ==========================
        function clearForm() {

            document.getElementById("name").value = "";
            document.getElementById("description").value = "";
            document.getElementById("price").value = "";
            document.getElementById("duration").value = "";
        }

        // ==========================
        // INICIAR
        // ==========================
        loadServices();

    </script>

</body>

</html>
